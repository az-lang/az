[package]
name = "az_lang_wasm_binding"
description = "AZ language Wasm binding."
license = "MIT"
repository = "https://github.com/az-lang/az"
version = "0.0.0"
edition = "2021"
rust-version = "1.71.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.69"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "^1.0.117"
wasm-bindgen = "^0.2.92"

[dependencies.az_lang]
path = "../language"
features = ["serde"]
